version: "3.8"

services:
  ticket-sniper:
    build:
      context: .
      args:
        TIX_INSTALL_SCRAPLING: ${TIX_INSTALL_SCRAPLING:-0}
    container_name: ticket_sniper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SEATGEEK_CLIENT_ID=${SEATGEEK_CLIENT_ID}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ARGUS_BASE_URL=${ARGUS_BASE_URL}
      - ARGUS_API_KEY=${ARGUS_API_KEY}
      - TZ_DISPLAY=${TZ_DISPLAY:-America/Los_Angeles}
      - TIER2_MAX_REQUESTS_PER_DAY=${TIER2_MAX_REQUESTS_PER_DAY:-600}
      - GATE_MARGIN=${GATE_MARGIN:-0.15}
      - DEADMAN_HOURS=${DEADMAN_HOURS:-6}
      - TIX_PROTOTYPE_MODE=${TIX_PROTOTYPE_MODE:-0}
      - SCRAPLING_ENABLED=${SCRAPLING_ENABLED:-0}
      - SCRAPLING_SOURCE=${SCRAPLING_SOURCE:-argus}
      - SCRAPLING_HEADLESS=${SCRAPLING_HEADLESS:-1}
      - SCRAPLING_TIMEOUT_SECONDS=${SCRAPLING_TIMEOUT_SECONDS:-30}
      - SCRAPLING_RATE_LIMIT_PER_MINUTE=${SCRAPLING_RATE_LIMIT_PER_MINUTE:-30}
      - SCRAPLING_REQUEST_DELAY_SECONDS=${SCRAPLING_REQUEST_DELAY_SECONDS:-1.0}
      - SCRAPLING_SESSION_LIFETIME_SECONDS=${SCRAPLING_SESSION_LIFETIME_SECONDS:-900}
      - DATABASE_PATH=/data/tickets.sqlite3
    volumes:
      - sniper_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  sniper_data:
    driver: local
