name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Run focused behavioral suites
        run: python -m pytest tests/test_event_polling.py tests/test_gate_evaluator.py tests/test_rule_evaluator.py tests/test_listing_collection.py tests/test_alert_pipeline.py tests/test_notifications.py tests/test_deadman.py
      - name: Run full repository suite
        run: python -m pytest
